name: Build Pathfinder WASM

on:
  push:
    branches: [main]
    paths:
      - "viewer-rs/**"
      - ".github/workflows/build-wasm.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - name: Build Rust renderer
        working-directory: viewer-rs
        run: |
          CARGO_TARGET_DIR=/tmp/viewer-target wasm-pack build --target web --release
      - name: Update checked-in WASM runtime
        run: |
          cp viewer-rs/pkg/viewer_bg.wasm public/wasm/viewer_bg.wasm
          cp viewer-rs/pkg/viewer.js src/lib/wasm/viewer/viewer.js
          cp viewer-rs/pkg/viewer.d.ts src/lib/wasm/viewer/viewer.d.ts
          sed -i "s|new URL('viewer_bg.wasm', import.meta.url)|'/wasm/viewer_bg.wasm'|" src/lib/wasm/viewer/viewer.js
      - name: Commit rebuilt runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/wasm/viewer_bg.wasm src/lib/wasm/viewer/viewer.js src/lib/wasm/viewer/viewer.d.ts
          if git diff --cached --quiet; then
            echo "WASM runtime is already up to date."
          else
            git commit -m "Build Pathfinder WASM runtime"
            git push
          fi
